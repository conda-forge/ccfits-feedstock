{% set name = "ccfits" %}
{% set version = "2.6" %}
{% set sha256 = "2bb439db67e537d0671166ad4d522290859e8e56c2f495c76faa97bc91b28612" %}

package:
  name: {{ name|lower }}
  version: "{{ version }}"

source:
  url: https://heasarc.gsfc.nasa.gov/FTP/software/fitsio/ccfits/v{{ version }}/CCfits-{{ version }}.tar.gz
  folder: CCfits
  sha256: {{ sha256 }}
  patches:
    - 0001-Add_missing_m4_macros.patch
    - 0002-Fix_CXX_LIB_PATH_macro.patch
    - 0003-Pass_no_undefined_libtool.patch  # [win]

build:
  number: 5

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - automake  # [not win]
    - autoconf  # [not win]
    - libtool  # [not win]
    - autotools_clang_conda  # [win]
    - make
  host:
    - cfitsio
  run:
    - cfitsio

test:
  commands:
    - test -f ${CONDA_PREFIX}/lib/libCCfits.so  # [linux]
    - test -f ${CONDA_PREFIX}/lib/libCCfits.dylib  # [osx]
    - test -d ${CONDA_PREFIX}/include/CCfits  # [not win]
    - if not exist "%LIBRARY_PREFIX%\bin\CCfits-*.dll" exit 1  # [win]
    - if not exist "%LIBRARY_PREFIX%\lib\ccfits.lib" exit 1  # [win]
    - if not exist "%LIBRARY_PREFIX%\include\CCfits" exit 1  # [win]

about:
  summary: CCfits is an object oriented interface to the cfitsio library. It is designed to make the capabilities of cfitsio available to programmers working in C++. It is written in ANSI C++ and implemented using the C++ Standard Library with namespaces, exception handling, and member template functions.
  home: https://heasarc.gsfc.nasa.gov/fitsio/ccfits/
  license: CFITSIO
  license_file: CCfits/License.txt
  doc_url: https://heasarc.gsfc.nasa.gov/fitsio/ccfits/html/index.html

extra:
  recipe-maintainers:
    - giacomov
    - teake
    - feng1m8
